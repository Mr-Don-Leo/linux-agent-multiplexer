[package]
name = "agentmux"
version = "0.3.1"
description = "AgentMux — lightweight Linux multiplexer for Claude Code and Codex agent sessions"
authors = ["Mr-Don-Leo and contributors"]
license = "MIT"
repository = "https://github.com/Mr-Don-Leo/linux-agent-multiplexer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
dirs = "6"

[profile.release]
lto = true
codegen-units = 1
strip = true
